name: Prune old container images

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [bluebuild]
    branches: [main]
    types: [completed]

# Publishing and pruning must never overlap, including manual runs.
concurrency:
  group: asahi-bluefin-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always use trusted default-branch code, never a workflow_run head SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Test retention rules
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Select weekly archives
        id: retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/retention.py
      - name: Prune old images and their unused signatures
        # v1, pinned so upstream changes cannot silently gain package write access.
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          token: ${{ github.token }}
          owner: okwalerie
          package: asahi-bluefin
          # All builds for seven days; one per UTC calendar week up to one month.
          older-than: 7 days
          keep-n-tagged: 0
          exclude-tags: ${{ steps.retention.outputs.exclude }}
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
          validate: true
