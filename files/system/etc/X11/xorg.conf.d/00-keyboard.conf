# Keep Xorg fallback sessions aligned with the console and GNOME defaults.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "us"
        Option "XkbModel" "microsoftpro"
        Option "XkbVariant" "colemak"
        Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
