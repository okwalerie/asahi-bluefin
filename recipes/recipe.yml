---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: asahi-bluefin
description: Minimal Fedora Asahi Remix Silverblue with Homebrew and Tailscale.

# Keep the Asahi kernel, Mesa, firmware, audio, and boot stack intact.
base-image: quay.io/fedora-asahi-remix-atomic-desktops/silverblue
image-version: 44
platforms:
  - linux/arm64

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - tailscale.repo
    install:
      packages:
        - firefox
        - firefox-langpacks
        - chromium
        - repo: tailscale-stable
          packages:
            - tailscale

  - type: brew
    brew-analytics: false

  # rpm-ostree canonicalizes /usr mtimes to epoch zero. update-m1n1 must not
  # ask gzip to encode that timestamp, because gzip exits 2 and aborts safely.
  - type: script
    scripts:
      - patch-update-m1n1.sh

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: signing
