---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: asahi-bluefin
description: A personal, Bluefin-inspired Fedora Asahi Remix Silverblue image.

# Keep the Asahi kernel, Mesa, firmware, audio, and boot stack intact.
base-image: quay.io/fedora-asahi-remix-atomic-desktops/silverblue
image-version: 44
platforms:
  - linux/arm64

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - tailscale.repo
        - ublue-packages.repo
        - ghostty.repo
        - starship.repo
        - claude-desktop-bin.repo
        - codex-desktop-bin.repo
        - handy.repo
    remove:
      auto-remove: false
      packages:
        - firefox
        - firefox-langpacks
    install:
      packages:
        # desktop applications and claude cowork's arm64 virtualization path
        - chromium
        - chezmoi
        - emacs-pgtk
        - qemu-system-aarch64
        - edk2-aarch64
        - virtiofsd

        # portable terminal conveniences; deliberately no atuin
        - bat
        - direnv
        - eza
        - fastfetch
        - fd-find
        - fzf
        - gh
        - glow
        - gum
        - jq
        - just
        - ripgrep
        - ShellCheck
        - tealdeer
        - tmux
        - trash-cli
        - unzip
        - wl-clipboard
        - yq
        - zoxide

        # fedora-packaged extensions avoid build-time extensions.gnome.org
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-blur-my-shell
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection
        # each enabled build-only repo has an includepkgs allowlist; resolving
        # in one transaction keeps fedora available for their dependencies.
        - tailscale
        - uupd
        - ghostty
        - starship
        - claude-desktop-bin
        - codex-desktop
        - handy

  # The Fedora aarch64 package is already present, so this module skips its
  # amd64-only downloader and contributes only the user init/update units.
  - type: chezmoi
    repository: git@github.com:okwalerie/dotfiles.git
    branch: fedora-asahi-arm64
    all-users: true
    run-every: 1d
    wait-after-boot: 5m
    file-conflict-policy: skip

  - type: fonts
    fonts:
      url-fonts:
        - name: JetBrainsMonoNerdFont
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.zip
        - name: NerdFontsSymbolsOnly
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/NerdFontsSymbolsOnly.zip

  - type: brew
    brew-analytics: false
    direct-pull: true
    installer-commit: ca0130bd52235f2fcb2bf23cfdda004bc5d250c1
    # uupd owns the one update cadence; do not create competing timers.
    auto-update: false
    auto-upgrade: false

  # Kept manual while we evaluate whether a second user package manager earns
  # its keep next to Brew. The module otherwise creates its own update timer.
  - type: soar
    auto-upgrade: false

  - type: default-flatpaks@v2
    configurations:
      - scope: user
        notify: false
        repo:
          name: flathub
          title: Flathub (user)
        install:
          - org.mozilla.firefox
          - io.github.kolunmi.Bazaar
          - io.missioncenter.MissionCenter
          - com.mattjakeman.ExtensionManager
          - com.github.wwmm.easyeffects
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse

  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
    include:
      - zz1-asahi-bluefin.gschema.override

  # rpm-ostree canonicalizes /usr mtimes to epoch zero. update-m1n1 must not
  # ask gzip to encode that timestamp, because gzip exits 2 and aborts safely.
  - type: script
    scripts:
      - patch-update-m1n1.sh

  - type: justfiles
    install: false
    validate: true
    include:
      - asahi-bluefin.just

  # vconsole.conf is consumed in early boot, so regenerate only after every
  # files/script setting that can affect the initramfs is present.
  - type: initramfs

  # These are the only portable custom arguments from the boot-tested host.
  # uupd uses bootc, which applies image-owned kargs on the next deployment.
  - type: kargs
    arch: aarch64
    kargs:
      - appledrm.show_notch=true
      - hid_apple.swap_fn_leftctrl=1

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - uupd.timer
        - asahi-bluefin-update-m1n1.service

  - type: signing
